# GitHub Actions auto-reads YAML config files in .github/workflows/ directory of a repo.

name: Continuous Integration

on:
  push:
    branches: [ main ] # Consider removing this if solely relying on pull_request triggers to avoid redundant runs.
  pull_request:
    branches: [ main ]

jobs:
  quality-check:
    name: quality-check (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.14']

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          # cache: 'pip' # Reduces build time by caching downloaded libraries.

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt

      - name: Run Linting
        run: |
          make lint # Uses the Makefile to maintain standardisation.

      - name: Run Tests
        run: |
          # Use the python module runner to ensure paths are respected
          python -m pytest tests/ --cov=app --cov-report=term-missing --cov-fail-under=80

      - name: Upload Coverage Report
        uses: actions/upload-artifact@v4
        with:
          name: html-coverage-report-py${{ matrix.python-version }}
          path: htmlcov/
        if: always()